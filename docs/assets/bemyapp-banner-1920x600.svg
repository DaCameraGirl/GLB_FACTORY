<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" role="img" aria-label="GLB_FACTORY — Photo to Procedural 3D Avatar Pipeline">
  <defs>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f3ef"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="65%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1920" height="600" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background layers -->
    <rect width="1920" height="600" fill="url(#bgMain)"/>
    <rect width="1920" height="600" fill="url(#grid)"/>
    <rect width="1920" height="600" fill="url(#glowCyan)"/>
    <rect width="1920" height="600" fill="url(#glowPink)"/>
    <rect width="1920" height="600" fill="url(#glowCenter)"/>

    <!-- Animated scanlines -->
    <rect x="-300" y="0" width="180" height="600" fill="#22d3ee" opacity="0.04">
      <animate attributeName="x" values="-300;2100" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="0" width="140" height="600" fill="#db2777" opacity="0.03">
      <animate attributeName="x" values="-400;2200" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Decorative corner elements -->
    <g opacity="0.3">
      <rect x="40" y="40" width="120" height="4" rx="2" fill="#22d3ee">
        <animate attributeName="width" values="120;180;120" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="52" width="80" height="3" rx="1.5" fill="#db2777">
        <animate attributeName="width" values="80;140;80" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="1760" y="554" width="120" height="4" rx="2" fill="#db2777">
        <animate attributeName="width" values="120;180;120" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="1800" y="544" width="80" height="3" rx="1.5" fill="#22d3ee">
        <animate attributeName="width" values="80;140;80" dur="3.7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Main title with glow effect -->
    <text x="960" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="110" font-weight="900" letter-spacing="4" fill="url(#titleGrad)" filter="url(#glow)">
      GLB_FACTORY
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.8s" repeatCount="indefinite"/>
    </text>
    
    <!-- Glowing outline effect -->
    <text x="960" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="110" font-weight="900" letter-spacing="4" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0">
      GLB_FACTORY
      <animate attributeName="opacity" values="0;0.6;0" dur="2.8s" repeatCount="indefinite"/>
    </text>

    <!-- Subtitle -->
    <text x="960" y="280" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#c8c8c2" letter-spacing="1.5">
      PHOTO → PROCEDURAL 3D AVATAR PIPELINE
    </text>

    <!-- Animated divider line -->
    <rect x="460" y="320" width="1000" height="3" rx="1.5" fill="#1a1a1a"/>
    <rect x="560" y="320" width="800" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="560;660;560" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="800;600;800" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Feature highlights -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#9d9d98">
      <text x="960" y="380" text-anchor="middle">
        ⚡ BROWSER-BASED &#183; NO BLENDER REQUIRED &#183; INSTANT .GLB EXPORT
      </text>
      <text x="960" y="420" text-anchor="middle" fill="#22d3ee" opacity="0.95">
        🎭 15+ CREATURE STYLES &#183; 🦴 FULL RIG CONTROL &#183; 🌀 DNA MUTATION LAB
      </text>
      <text x="960" y="460" text-anchor="middle" fill="#db2777" opacity="0.95">
        🔫 WEAPONS &amp; GEAR &#183; 📸 SNAP STUDIO &#183; 🎨 LIVE TEXTURE BLENDING
      </text>
    </g>

    <!-- Tech stack badges -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">
      <rect x="640" y="505" width="140" height="32" rx="6" fill="#000000" opacity="0.6"/>
      <text x="710" y="528" text-anchor="middle" fill="#ffffff">THREE.JS</text>
      
      <rect x="800" y="505" width="120" height="32" rx="6" fill="#149ECA" opacity="0.8"/>
      <text x="860" y="528" text-anchor="middle" fill="#ffffff">REACT 19</text>
      
      <rect x="940" y="505" width="110" height="32" rx="6" fill="#646CFF" opacity="0.8"/>
      <text x="995" y="528" text-anchor="middle" fill="#ffffff">VITE 6</text>
      
      <rect x="1070" y="505" width="210" height="32" rx="6" fill="#06B6D4" opacity="0.8"/>
      <text x="1175" y="528" text-anchor="middle" fill="#ffffff">TAILWIND CSS v4</text>
    </g>

    <!-- Animated status indicators -->
    <circle cx="180" cy="100" r="6" fill="#22d3ee" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1740" cy="500" r="5" fill="#db2777" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;7;5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1680" cy="90" r="4.5" fill="#fbbf24" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.5;6.5;4.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="510" r="4" fill="#4ade80" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6;4" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Version and attribution -->
    <g font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#5a5a55" opacity="0.9">
      <text x="80" y="575">v1.0-RELEASE</text>
      <text x="1840" y="575" text-anchor="end">BY DACAMERAGIRL</text>
    </g>

    <!-- Pulsing "LIVE DEMO" badge -->
    <g transform="translate(960, 340)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#22d3ee" opacity="0.15">
        <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="6" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="900" fill="#22d3ee" letter-spacing="1">
        🌐 LIVE DEMO
        <animate attributeName="fill" values="#22d3ee;#ffffff;#22d3ee" dur="2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Decorative data stream lines -->
    <g opacity="0.15">
      <line x1="0" y1="150" x2="400" y2="150" stroke="#22d3ee" stroke-width="1" stroke-dasharray="10,5">
        <animate attributeName="stroke-dashoffset" values="0;-300" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="1520" y1="450" x2="1920" y2="450" stroke="#db2777" stroke-width="1" stroke-dasharray="10,5">
        <animate attributeName="stroke-dashoffset" values="0;-300" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>
