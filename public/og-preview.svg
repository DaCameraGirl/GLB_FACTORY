<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="GLB_FACTORY — Photo to Procedural 3D Avatar Pipeline">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="55%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="88%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="6%" cy="92%" r="50%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f3ef"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.6"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="300" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glowCyan)"/>
    <rect width="1200" height="300" fill="url(#glowPink)"/>

    <!-- Scanline sweep -->
    <rect x="-200" y="0" width="120" height="300" fill="#22d3ee" opacity="0.05">
      <animate attributeName="x" values="-200;1300" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Pulsing headline -->
    <text x="600" y="128" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="60" font-weight="800" letter-spacing="1" fill="url(#titleGrad)">
      GLB_FACTORY
      <animate attributeName="opacity" values="0.72;1;0.72" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="128" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="60" font-weight="800" letter-spacing="1" fill="none" stroke="#22d3ee" stroke-width="1.4" opacity="0">
      GLB_FACTORY
      <animate attributeName="opacity" values="0;0.5;0" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="166" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#a8a8a2" letter-spacing="0.5">
      PHOTO &#8594; PROCEDURAL 3D AVATAR PIPELINE // EXPORTS REAL .GLB
    </text>

    <rect x="330" y="188" width="540" height="2" rx="1" fill="#2a2a2a"/>
    <rect x="430" y="188" width="340" height="2" rx="1" fill="#22d3ee" opacity="0.75">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#22d3ee;#db2777;#22d3ee" dur="6.4s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#7d7d78">
      <text x="600" y="222" text-anchor="middle">UPLOAD A FACE &#183; RIG A VOXEL BODY &#183; MUTATE THE DNA &#183; EXPORT GAME-READY</text>
      <text x="600" y="248" text-anchor="middle" fill="#db2777" opacity="0.9">NOW WITH CREATURES, WEAPONS &amp; A SPRINKLE OF CHAOS</text>
    </g>

    <!-- Blinking status dots, matching the app's terminal aesthetic -->
    <circle cx="96" cy="60" r="3" fill="#22d3ee" opacity="0.7">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1104" cy="236" r="2.5" fill="#db2777" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="52" r="2" fill="#fbbf24" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="244" r="2" fill="#4ade80" opacity="0.55">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.1s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#4b4b47" opacity="0.85">
      <text x="60" y="284">v1.0-RELEASE</text>
      <text x="1140" y="284" text-anchor="end">ENGINE // THREE.JS</text>
    </g>
  </g>
</svg>
